name: Build and release game apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag for this release (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/UltimateSnake-Setup.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: dist/UltimateSnake.apk
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-installer
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Ultimate Snake ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/UltimateSnake-Setup.exe
            release-assets/UltimateSnake.apk
